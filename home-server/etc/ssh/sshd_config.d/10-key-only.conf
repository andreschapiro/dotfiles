# SSH Server Configuration: Key-based Authentication Only
# Managed by dotfiles: ~/dotfiles/home-server/etc/ssh/sshd_config.d/10-key-only.conf
#
# This configuration enforces SSH key-based authentication and disables
# password authentication for improved security.

# Disable password authentication
PasswordAuthentication no

# Disable challenge-response authentication (prevents some PAM-based password auth)
KbdInteractiveAuthentication no

# Disable empty passwords (shouldn't be used anyway, but extra safety)
PermitEmptyPasswords no

# Enable public key authentication (default, but explicit is good)
PubkeyAuthentication yes

# Optional: Disable root login with password (only allow keys)
# Uncomment the following line if you want to allow root login ONLY with keys
# PermitRootLogin prohibit-password
