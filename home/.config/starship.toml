# Starship configuration with Vaporwave colors
# Colors from onedarkpro.nvim vaporwave theme

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Vaporwave palette:
# bg = "#222435"
# fg = "#B4B7CF"
# red = "#E16765"
# orange = "#EAA041"
# yellow = "#EAE852"
# green = "#75BE78"
# cyan = "#46A3AF"
# blue = "#25ABE4"
# purple = "#c678dd"
# gray = "#585B89"

# Format - two line prompt with newline before
format = """
$os\
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

# Add newline before each prompt
add_newline = true

# OS icon
[os]
disabled = false
format = '[$symbol](#B4B7CF) '

[os.symbols]
Arch = ""
Macos = ""
Linux = ""

# Directory
[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = '#25ABE4 bold'
read_only = ' '
read_only_style = '#E16765 bold'
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ''
fish_style_pwd_dir_length = 1
before_repo_root_style = '#25ABE4 bold'
repo_root_style = '#25ABE4 bold'

# Git branch
[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
symbol = ' '
style = '#75BE78 bold'
truncation_length = 32
truncation_symbol = '…'

# Git status
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = '#E16765 bold'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '\$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

# Prompt character
[character]
success_symbol = '[❯](#75BE78 bold)'
error_symbol = '[❯](#E16765 bold)'
vimcmd_symbol = '[❮](#75BE78 bold)'
vimcmd_visual_symbol = '[V](#c678dd bold)'
vimcmd_replace_symbol = '[▶](#EAA041 bold)'

# Command duration
[cmd_duration]
min_time = 2_000
format = '[$duration]($style) '
style = '#EAE852 bold'
show_milliseconds = false

# Status
[status]
disabled = false
format = '[$symbol$status]($style) '
style = '#E16765 bold'
symbol = '✘'
not_executable_symbol = '🚫'
not_found_symbol = '🔍'
sigint_symbol = '🧱'
signal_symbol = '⚡'

# Background jobs
[jobs]
format = '[$symbol$number]($style) '
symbol = '✦'
style = '#25ABE4 bold'
number_threshold = 1

# Python
[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = ' '
style = '#EAE852 bold'
pyenv_version_name = false
detect_extensions = ['py']
detect_files = ['.python-version', 'Pipfile', 'pyproject.toml', 'requirements.txt', 'setup.py', 'tox.ini']

# Node.js
[nodejs]
format = '[$symbol($version )]($style)'
symbol = ' '
style = '#75BE78 bold'
detect_extensions = ['js', 'mjs', 'cjs', 'ts', 'mts', 'cts']
detect_files = ['package.json', '.node-version', '.nvmrc']

# Go
[golang]
format = '[$symbol($version )]($style)'
symbol = ' '
style = '#46A3AF bold'
detect_extensions = ['go']
detect_files = ['go.mod', 'go.sum', '.go-version']

# Rust
[rust]
format = '[$symbol($version )]($style)'
symbol = ' '
style = '#EAA041 bold'
detect_extensions = ['rs']
detect_files = ['Cargo.toml', 'Cargo.lock']

# Ruby
[ruby]
format = '[$symbol($version )]($style)'
symbol = ' '
style = '#E16765 bold'
detect_extensions = ['rb']
detect_files = ['.ruby-version', 'Gemfile']

# Kubernetes
[kubernetes]
format = '[$symbol$context( \($namespace\))]($style) '
symbol = '☸ '
style = '#25ABE4 bold'
disabled = false
detect_extensions = []
detect_files = ['k8s']
detect_folders = []

# Terraform
[terraform]
format = '[$symbol$workspace]($style) '
symbol = '💠 '
style = '#c678dd bold'
detect_extensions = ['tf', 'tfplan', 'tfstate']
detect_files = []

# AWS
[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
symbol = '☁️ '
style = '#EAA041 bold'

# Azure
[azure]
format = '[$symbol($subscription)]($style) '
symbol = 'ﴃ '
style = '#25ABE4 bold'
disabled = false

# Google Cloud
[gcloud]
format = '[$symbol$account(@$domain)(\($region\))]($style) '
symbol = '☁️ '
style = '#25ABE4 bold'

# Container
[container]
format = '[$symbol \[$name\]]($style) '
symbol = '⬢'
style = '#E16765'

# Time
[time]
disabled = false
format = '[$time]($style) '
style = '#585B89'
time_format = '%T'
utc_time_offset = 'local'

# Direnv
[direnv]
format = '[$symbol$loaded/$allowed]($style) '
symbol = 'direnv '
style = '#EAA041 bold'
disabled = false
detect_extensions = []
detect_files = ['.envrc']
detect_folders = []
allowed_msg = 'allowed'
denied_msg = 'denied'
loaded_msg = 'loaded'
unloaded_msg = 'not loaded'

# Disable unused segments
[package]
disabled = true

[java]
disabled = true

[dotnet]
disabled = true

[php]
disabled = true

[lua]
disabled = true

[perl]
disabled = true

[scala]
disabled = true

[haskell]
disabled = true

# Shell indicator
[shell]
disabled = false
format = '[$indicator]($style) '
bash_indicator = 'bsh'
fish_indicator = 'fsh'
zsh_indicator = ''
powershell_indicator = 'psh'
style = '#585B89'
